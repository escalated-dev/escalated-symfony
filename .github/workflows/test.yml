name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit tests

  # The kernel tests boot the bundle in a host application and run its
  # migrations, schema validation and HTTP flows against a real database.
  # The PHPUnit job above runs them on SQLite; these repeat them on the
  # databases hosts actually deploy on.
  kernel-pgsql:
    name: Kernel tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escalated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ESCALATED_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/escalated_test?serverVersion=17&charset=utf8

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run kernel tests
        run: vendor/bin/phpunit tests/Kernel

  kernel-mysql:
    name: Kernel tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: escalated_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      ESCALATED_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/escalated_test?serverVersion=8.4.0&charset=utf8mb4

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run kernel tests
        run: vendor/bin/phpunit tests/Kernel
