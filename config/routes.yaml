# Escalated bundle routes.
#
# Import this file from the host application, e.g. config/routes/escalated.yaml:
#
#     escalated:
#         resource: '@EscalatedBundle/config/routes.yaml'
#
# The `escalated` route loader (Escalated\Symfony\Routing\EscalatedRouteLoader)
# reads the bundle configuration to decide what to register:
#
#   - the JSON API (/api/v1/...), always;
#   - the customer, agent, admin and widget UI, when `ui_enabled` is true;
#   - the newsletter routes, when `ui_enabled` and `enable_newsletters` are both true.
#
# Every route is mounted under `route_prefix` (default /support).

escalated:
    resource: .
    type: escalated
