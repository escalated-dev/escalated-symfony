services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            string $tablePrefix: '%escalated.table_prefix%'
            # Every service in this bundle that injects an EntityManagerInterface
            # gets Escalated's manager, not the host's default one. Bound by type
            # so the sixty-two call sites need no change -- and so a new service
            # cannot accidentally reach the primary database by autowiring the
            # default manager. `escalated.entity_manager` is aliased in
            # EscalatedBundle from the `entity_manager` config option, and points
            # at the default manager when that is unset.
            Doctrine\ORM\EntityManagerInterface: '@escalated.entity_manager'
            # The inbound email shared secret, used by InboundEmailController
            # (webhook authentication), InboundRouter and ThreadingHeadersService
            # (signed Reply-To addresses). Empty disables the inbound webhook.
            string $inboundSecret: '%escalated.inbound_secret%'

    # Auto-tag host-defined ticket action services so the registry can collect them.
    _instanceof:
        Escalated\Symfony\Contract\TicketActionInterface:
            tags: ['escalated.ticket_action']
        Escalated\Symfony\Plugin\PluginInterface:
            tags: ['escalated.plugin']

    # Auto-register everything under the bundle's src tree. Individual services
    # below override arguments / tags where needed; this resource catches the
    # rest (notably every class under Service/, Serializer/, Security/,
    # EventSubscriber/, Repository/, Command/, Controller/ that otherwise
    # wouldn't be registered and that the bundle depends on internally).
    Escalated\Symfony\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/DependencyInjection/'
            - '../src/EscalatedBundle.php'
            # Plain config wrapper, instantiated by the registry — not a service.
            - '../src/Support/ArrayTicketAction.php'
            # Plain security identity built by ApiTokenAuthenticator — not a service.
            - '../src/Security/ApiTokenUser.php'
            - '../src/Security/GuestVerificationException.php'
            - '../src/Security/GuestCodeBudgetException.php'
            # Attribute and static map, not services.
            - '../src/Security/RequiresFeature.php'
            - '../src/Security/RoutePermissions.php'
            - '../src/Security/TwoFactorSession.php'
            - '../src/Doctrine/TicketVisibilityFilter.php'
            # Plugin values built by the registry, not services.
            - '../src/Plugin/PluginContext.php'
            - '../src/Plugin/RegisteredPlugin.php'
            - '../src/Plugin/PluginHttp.php'
            - '../src/Plugin/Bridge/JsonRpcClient.php'
            - '../src/Plugin/Bridge/BridgeException.php'

    # Install-level access switches (ADR 2026-10-29-configurable-access-features).
    Escalated\Symfony\Security\AccessFeatures:
        arguments:
            $rolesPermissions: '%escalated.access.roles_permissions%'
            $twoFactor: '%escalated.access.two_factor%'

    # Two-factor (ADR 2026-10-29-configurable-access-features): TOTP through
    # pragmarx/google2fa, secrets and recovery codes sealed under kernel.secret,
    # and the verify route limited to 5 attempts per minute per user (counters
    # in the guest rate limit cache pool).
    Escalated\Symfony\Security\SecretSealer:
        arguments:
            $secret: '%kernel.secret%'

    Escalated\Symfony\Service\TwoFactorService:
        arguments:
            $required: '%escalated.two_factor.required%'
            $issuer: '%escalated.two_factor.issuer%'

    escalated.two_factor.limiter_storage:
        class: Symfony\Component\RateLimiter\Storage\CacheStorage
        arguments: ['@escalated.guest_rate_limit.cache']

    escalated.two_factor.limiter:
        class: Symfony\Component\RateLimiter\RateLimiterFactory
        arguments:
            $config: { id: 'escalated_two_factor', policy: 'fixed_window', limit: 5, interval: '1 minute' }
            $storage: '@escalated.two_factor.limiter_storage'

    # Route loader behind @EscalatedBundle/config/routes.yaml. Applies ui_enabled,
    # enable_newsletters and route_prefix when the host's router loads it.
    Escalated\Symfony\Routing\EscalatedRouteLoader:
        arguments:
            $routePrefix: '%escalated.route_prefix%'
            $uiEnabled: '%escalated.ui_enabled%'
            $newslettersEnabled: '%escalated.enable_newsletters%'
            $env: '%kernel.environment%'
        tags: ['routing.loader']

    # Repositories (override to attach the Doctrine tag)
    Escalated\Symfony\Repository\TicketRepository:
        tags: ['doctrine.repository_service']

    Escalated\Symfony\Repository\DepartmentRepository:
        tags: ['doctrine.repository_service']

    Escalated\Symfony\Repository\EscalatedSettingRepository:
        tags: ['doctrine.repository_service']

    Escalated\Symfony\Repository\TicketStatusRepository:
        tags: ['doctrine.repository_service']

    # Import sources: every service tagged escalated.import_adapter
    # (autoconfigured for Contract\ImportAdapterInterface).
    Escalated\Symfony\Import\ImportAdapterRegistry:
        arguments:
            $adapters: !tagged_iterator escalated.import_adapter

    Escalated\Symfony\Import\ImportService:
        arguments:
            $userClass: '%escalated.user_class%'

    Escalated\Symfony\Import\ImportCredentials:
        arguments:
            $secret: '%kernel.secret%'

    # How a started import is run. The default runs it after the response
    # (kernel.terminate); a host with Messenger or another queue aliases this
    # to its own ImportDispatcherInterface.
    Escalated\Symfony\Import\ImportDispatcherInterface: '@Escalated\Symfony\Import\TerminateImportDispatcher'

    # Custom ticket action registry: tagged services + config-defined actions
    Escalated\Symfony\Service\TicketActionRegistry:
        arguments:
            $taggedActions: !tagged_iterator escalated.ticket_action
            $configActions: '%escalated.ticket_actions%'

    # Per-IP limits on the guest widget endpoints. `escalated.guest_rate_limit.cache`
    # is aliased in EscalatedBundle to the `guest_rate_limit.cache_pool` option
    # (default cache.app).
    Escalated\Symfony\Service\GuestRateLimiter:
        arguments:
            $cache: '@escalated.guest_rate_limit.cache'
            $enabled: '%escalated.guest_rate_limit.enabled%'
            $ticketsPerMinute: '%escalated.guest_rate_limit.tickets_per_minute%'
            $repliesPerMinute: '%escalated.guest_rate_limit.replies_per_minute%'
            $requestsPerMinute: '%escalated.guest_rate_limit.requests_per_minute%'

    # CORS for the widget API, for the origins WidgetOrigins allows (the
    # WidgetSettings allowedOrigins argument plus the widget_allowed_origins
    # admin setting). An empty list allows no other site.
    Escalated\Symfony\EventSubscriber\WidgetCorsSubscriber:
        arguments:
            $routePrefix: '%escalated.route_prefix%'
            $uiEnabled: '%escalated.ui_enabled%'

    # Verified guest access: emailed codes (budgets kept in the guest rate
    # limit's cache pool) and expiring grants, both keyed from kernel.secret.
    Escalated\Symfony\Security\GuestEmailVerification:
        arguments:
            $cache: '@escalated.guest_rate_limit.cache'
            $secret: '%kernel.secret%'
            $codesPerClientPerHour: '%escalated.guest_access.codes_per_client_per_hour%'
            $codesPerMailboxPerHour: '%escalated.guest_access.codes_per_mailbox_per_hour%'
            $fromAddress: '%escalated.guest_access.from_address%'

    Escalated\Symfony\Security\GuestAccess:
        arguments:
            $secret: '%kernel.secret%'
            $ttlMinutes: '%escalated.guest_access.ttl_minutes%'
            $acceptLegacyTokens: '%escalated.guest_access.accept_legacy_tokens%'

    Escalated\Symfony\Service\TicketService:
        arguments:
            $targetedSlas: '%escalated.targeted_slas%'

    # SlaService needs parameter injection
    Escalated\Symfony\Service\SlaService:
        arguments:
            $slaEnabled: '%escalated.sla.enabled%'
            $targetedSlas: '%escalated.targeted_slas%'
            $businessHoursOnly: '%escalated.sla.business_hours_only%'
            $businessHours: '%escalated.sla.business_hours%'

    Escalated\Symfony\Service\Newsletter\NewsletterDispatcher:
        arguments:
            $enabled: '%escalated.enable_newsletters%'
            $batchSize: '%escalated.newsletters.batch_size%'
            $claimTimeoutMinutes: '%escalated.newsletters.claim_timeout_minutes%'
            $autoPauseBounceRate: '%escalated.newsletters.auto_pause_bounce_rate%'
            $autoPauseThreshold: '%escalated.newsletters.auto_pause_threshold%'

    Escalated\Symfony\Service\Newsletter\NewsletterRenderer:
        arguments:
            $baseUrl: '%escalated.newsletters.base_url%'
            $defaultTheme: '%escalated.newsletters.default_theme%'
            $trackingEnabled: '%escalated.newsletters.tracking_enabled%'
            $brand:
                accent: '%escalated.newsletters.brand_accent%'
                logo_url: '%escalated.newsletters.brand_logo_url%'
                physical_address: '%escalated.newsletters.brand_physical_address%'

    # Outbound webhook HTTP transport (native curl; symfony/http-client is not a dependency)
    Escalated\Symfony\Http\WebhookHttpClientInterface:
        class: Escalated\Symfony\Http\CurlWebhookHttpClient

    # Refuses webhook URLs on private or reserved networks, on save and on delivery.
    Escalated\Symfony\Http\WebhookUrlGuard:
        arguments:
            $allowPrivateNetworks: '%escalated.webhooks.allow_private_networks%'

    # UI Rendering
    Escalated\Symfony\Rendering\UiRendererInterface:
        class: Escalated\Symfony\Rendering\InertiaUiRenderer

    Escalated\Symfony\Rendering\InertiaUiRenderer: ~

    # Security Voters
    Escalated\Symfony\Security\EnsureAgentVoter:
        tags: ['security.voter']

    Escalated\Symfony\Security\EnsureAdminVoter:
        tags: ['security.voter']

    Escalated\Symfony\Security\NewsletterPermissionVoter:
        tags: ['security.voter']

    Escalated\Symfony\Security\TicketRequesterVoter:
        tags: ['security.voter']

    # Commands
    Escalated\Symfony\Command\WakeSnoozedTicketsCommand:
        tags: ['console.command']

    Escalated\Symfony\Command\DispatchNewslettersCommand:
        arguments:
            $enabled: '%escalated.enable_newsletters%'
        tags: ['console.command']

    # Event Subscribers
    # Both security listeners run after routing (32), so the route name is known,
    # and after the host firewall (8): the firewall resets the token storage to
    # the session's token, so a token set before it is lost, and the session user
    # is unknown until it has run.
    #
    # The KB guard (6) runs after the API authenticator (7) so a valid bearer
    # token satisfies its authentication requirement.
    Escalated\Symfony\Security\KnowledgeBaseGuard:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 6 }

    # Requires an authenticated principal on /api routes and resolves bearer tokens.
    Escalated\Symfony\Security\ApiTokenAuthenticator:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 7 }
    Escalated\Symfony\EventSubscriber\InertiaDataSubscriber:
        arguments:
            $routePrefix: '%escalated.route_prefix%'
            $newslettersEnabled: '%escalated.enable_newsletters%'
        tags: ['kernel.event_subscriber']

    # Serializer Normalizers
    Escalated\Symfony\Serializer\AttachmentNormalizer:
        arguments:
            $baseStorageUrl: '%escalated.storage.base_url%'
        tags: ['serializer.normalizer']

    Escalated\Symfony\Serializer\TicketNormalizer:
        arguments:
            $ticketSubjectService: '@Escalated\Symfony\Service\TicketSubjectService'
        tags: ['serializer.normalizer']

    Escalated\Symfony\Service\TicketSubjectService:
        arguments:
            $allowedTypes: '%escalated.ticket_subjects.types%'
            $resolver: '@?escalated.ticket_subject_resolver'

    # Host users by key, for the names and agent lists the shared pages show.
    Escalated\Symfony\Rendering\UserDirectory:
        arguments:
            $userClass: '%escalated.user_class%'

    # Controllers
    Escalated\Symfony\Controller\Customer\TicketController:
        arguments:
            $allowCustomerClose: '%escalated.tickets.allow_customer_close%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Agent\DashboardController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Agent\TicketController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Agent\TicketSplitController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Admin\TicketController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Admin\DepartmentController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Admin\SettingsController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Admin\PublicTicketsSettingsController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Admin\TagController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Admin\UserController:
        arguments:
            $userClass: '%escalated.user_class%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Admin\SkillController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Admin\NewsletterController:
        arguments:
            $defaultFrom: '%escalated.newsletters.default_from%'
            $defaultReplyTo: '%escalated.newsletters.default_reply_to%'
            $defaultTheme: '%escalated.newsletters.default_theme%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Admin\NewsletterListController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Admin\NewsletterTemplateController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Admin\NewsletterSettingsController:
        arguments:
            $defaults:
                default_from: '%escalated.newsletters.default_from%'
                default_reply_to: '%escalated.newsletters.default_reply_to%'
                default_theme: '%escalated.newsletters.default_theme%'
                rate_limit_per_minute: '%escalated.newsletters.rate_limit_per_minute%'
                batch_size: '%escalated.newsletters.batch_size%'
                tracking_enabled: '%escalated.newsletters.tracking_enabled%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Public\NewsletterTrackingController:
        arguments:
            $enabled: '%escalated.enable_newsletters%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Public\NewsletterUnsubscribeController:
        arguments:
            $enabled: '%escalated.enable_newsletters%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Public\NewsletterViewInBrowserController:
        arguments:
            $enabled: '%escalated.enable_newsletters%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Newsletter\Webhook\NewsletterEspWebhookController:
        arguments:
            $enabled: '%escalated.enable_newsletters%'
        tags: ['controller.service_arguments']

    Escalated\Symfony\Service\SkillService:
        arguments:
            $userClass: '%escalated.user_class%'

    Escalated\Symfony\Controller\Api\TicketController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Api\TicketSubjectController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Agent\TicketSubjectController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Controller\Api\AuthController:
        tags: ['controller.service_arguments']

    Escalated\Symfony\Security\TicketAccess:
        arguments:
            $visibility: '%escalated.visibility%'
            $accountsEnabled: '%escalated.accounts.enabled%'
            $scopeAccounts: '%escalated.accounts.scope_agents%'
            $accountResolver: '@?escalated.account_resolver'
            $userResolver: '@?escalated.access_user_resolver'
            $userClass: '%escalated.user_class%'

    Escalated\Symfony\Doctrine\TicketAccessMetadata:
        arguments:
            $tablePrefix: '%escalated.table_prefix%'

    Escalated\Symfony\Broadcasting\BroadcasterInterface: '@Escalated\Symfony\Broadcasting\NullBroadcaster'

    Escalated\Symfony\Doctrine\Migration\TicketAccessMigrationFactory:
        decorates: doctrine.migrations.migrations_factory
        decoration_on_invalid: ignore
        arguments:
            $inner: '@Escalated\Symfony\Doctrine\Migration\TicketAccessMigrationFactory.inner'
            $tablePrefix: '%escalated.table_prefix%'

    # Plugins (docs/plugins.md): native plugins are services tagged
    # escalated.plugin (autoconfigured for Plugin\PluginInterface); SDK
    # plugins run in the Node plugin runtime behind the bridge.
    Escalated\Symfony\Plugin\PluginRegistry:
        arguments:
            $nativePlugins: !tagged_iterator escalated.plugin
            $routePrefix: '%escalated.route_prefix%'

    Escalated\Symfony\Plugin\Bridge\PluginBridge:
        arguments:
            $enabled: '%escalated.plugins.sdk.enabled%'
            $command: '%escalated.plugins.sdk.runtime_command%'
            $cwd: '%escalated.plugins.sdk.runtime_cwd%'
